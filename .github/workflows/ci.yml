name: ci

# Lint + test on every PR and push. The image is built and pushed only after
# both test jobs (go, proto) pass, and only on main or version tags — never on
# PRs. Requires repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker
# Hub access token).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  PDFIUM_DIR: /opt/pdfium

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install libpdfium (CGO backend)
        run: |
          sudo mkdir -p "$PDFIUM_DIR"
          curl -fsSL --retry 3 \
            https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz \
            | sudo tar xz -C "$PDFIUM_DIR"
          sudo tee "$PDFIUM_DIR/pdfium.pc" >/dev/null <<EOF
          prefix=$PDFIUM_DIR
          libdir=$PDFIUM_DIR/lib
          includedir=$PDFIUM_DIR/include

          Name: PDFium
          Description: PDFium
          Version: 1
          Libs: -L\${libdir} -lpdfium
          Cflags: -I\${includedir}
          EOF

      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go' | grep -v '^gen/'))"
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi

      - name: vet
        run: go vet ./...
        env:
          CGO_ENABLED: "1"
          PKG_CONFIG_PATH: ${{ env.PDFIUM_DIR }}
          LD_LIBRARY_PATH: ${{ env.PDFIUM_DIR }}/lib

      - name: test
        run: go test -race ./...
        env:
          CGO_ENABLED: "1"
          PKG_CONFIG_PATH: ${{ env.PDFIUM_DIR }}
          LD_LIBRARY_PATH: ${{ env.PDFIUM_DIR }}/lib

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
      - run: buf lint proto

  build-push:
    runs-on: ubuntu-latest
    # Gate the image on tests: this job won't start until both go and proto
    # succeed (needs implies success). Skip on PRs and on forks.
    needs: [go, proto]
    if: github.event_name == 'push' && github.repository_owner == 'ogen-app'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/pdf-service
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
